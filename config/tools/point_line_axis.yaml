name: point_line_axis
version: 1
tier: primitive
description: 'Create the point where a straight line through a base point at a given angle crosses the
  line between two other points.

  Use it when you need a horizontal or vertical line (or any angle) from a point to meet another line.
  Do not use it when both lines are given by pairs of points: use point_line_line.'
parameters:
  label:
    type: string
    description: Name for the new point, unique in the pattern, for example B1.
  base_point:
    type: string
    x-ref: point
    description: A point the first line passes through. Give its label (for example A) or a landmark name
      (for example bodice_front.SNP).
  angle:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Direction of the line through the base point. Angles go counter-clockwise: 0 is to the
      right, 90 is up the page. A number or a formula in degrees. A formula may use measurements, variables
      and other lengths, for example #hem_flare/2 + 1.'
  line_start:
    type: string
    x-ref: point
    description: One end of the line to cross. Give its label (for example A) or a landmark name (for
      example bodice_front.SNP).
  line_end:
    type: string
    x-ref: point
    description: The other end of the line to cross. Give its label (for example A) or a landmark name
      (for example bodice_front.SNP).
required:
- label
- base_point
- angle
- line_start
- line_end
examples:
- instruction: Where a horizontal line from A meets line B-C
  call:
    label: D
    base_point: A
    angle: '0'
    line_start: B
    line_end: C
engine:
  builder: simple
  tag: point
  type: lineIntersectAxis
  set:
    name: '{label}'
    basePoint: '{base_point}'
    angle: '{angle}'
    p1Line: '{line_start}'
    p2Line: '{line_end}'
