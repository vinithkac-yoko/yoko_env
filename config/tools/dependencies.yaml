name: dependencies
version: 1
tier: read
description: 'List the objects an object was built directly from.

  Use it when you want to know what an object rests on. Do not use it when you want what rests on it:
  use dependents.'
parameters:
  object:
    type: string
    x-ref: object
    description: 'An object: its label (a point), its name (a curve or arc), #<id>, or a landmark name.'
required:
- object
examples:
- instruction: What is C built from?
  call:
    object: C
handler: dependencies
