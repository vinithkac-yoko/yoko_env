name: get_object
version: 1
tier: read
description: 'Describe one object: how it was made, its formulas, where it is or how long it is, and what
  it depends on or is used by.

  Use it when you need to see why an object is where it is, or what an edit would affect. Do not use it
  when you only need to find objects: use find_objects.'
parameters:
  object:
    type: string
    x-ref: object
    description: 'An object: its label (a point), its name (a curve or arc), #<id>, or a landmark name.'
required:
- object
examples:
- instruction: Tell me about B
  call:
    object: B
handler: get_object
