name: point_at_distance_angle
version: 1
tier: primitive
description: 'Create a point at a given distance and direction from an existing point, and draw a line
  to it.

  Use it when you know how far and in which direction the new point lies from another point. Do not use
  it when the point lies on a line between two points (use point_along_line) or at a right angle to a
  line (use point_perpendicular).'
parameters:
  label:
    type: string
    description: Name for the new point, unique in the pattern, for example B1.
  base_point:
    type: string
    x-ref: point
    description: The point to measure from. Give its label (for example A) or a landmark name (for example
      bodice_front.SNP).
  length:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Distance from the base point. A number or a formula in the pattern''s unit (cm in the
      basic set). A formula may use measurements, variables and other lengths, for example #hem_flare/2
      + 1.'
  angle:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Direction from the base point. Angles go counter-clockwise: 0 is to the right, 90 is
      up the page. A number or a formula in degrees. A formula may use measurements, variables and other
      lengths, for example #hem_flare/2 + 1.'
required:
- label
- base_point
- length
- angle
examples:
- instruction: Mark a point 1.5 cm below B
  call:
    label: B1
    base_point: B
    length: '1.5'
    angle: '270'
engine:
  builder: simple
  tag: point
  type: endLine
  set:
    name: '{label}'
    basePoint: '{base_point}'
    length: '{length}'
    angle: '{angle}'
