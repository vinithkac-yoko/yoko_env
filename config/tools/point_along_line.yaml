name: point_along_line
version: 1
tier: primitive
description: 'Create a point on the straight line from one point to another, at a given distance from
  the first.

  Use it when you need a point somewhere along an existing line, for example the middle (length = half
  the line). Do not use it when the point is off the line.'
parameters:
  label:
    type: string
    description: Name for the new point, unique in the pattern, for example B1.
  first_point:
    type: string
    x-ref: point
    description: The point the distance is measured from. Give its label (for example A) or a landmark
      name (for example bodice_front.SNP).
  second_point:
    type: string
    x-ref: point
    description: The other end of the line. Give its label (for example A) or a landmark name (for example
      bodice_front.SNP).
  length:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Distance from the first point along the line. A negative length goes the other way,
      past the first point. A number or a formula in the pattern''s unit (cm in the basic set). A formula
      may use measurements, variables and other lengths, for example #hem_flare/2 + 1.'
required:
- label
- first_point
- second_point
- length
examples:
- instruction: Mark the middle of line A-B
  call:
    label: C
    first_point: A
    second_point: B
    length: Line_A_B/2
engine:
  builder: simple
  tag: point
  type: alongLine
  set:
    name: '{label}'
    firstPoint: '{first_point}'
    secondPoint: '{second_point}'
    length: '{length}'
