name: point_shoulder
version: 1
tier: primitive
description: 'Create a point on the line through two points, beyond the second one, at a set distance
  from a third point. A line is drawn from the line''s ends to the new point.

  Use it when a point on a line must be a given distance from a point off the line, as for a shoulder
  length measured from the neck point. Do not use it when the distance is measured from a point on the
  line: use point_along_line.'
parameters:
  label:
    type: string
    description: Name for the new point, unique in the pattern, for example B1.
  line_start:
    type: string
    x-ref: point
    description: One end of the line the point lies on. Give its label (for example A) or a landmark name
      (for example bodice_front.SNP).
  line_end:
    type: string
    x-ref: point
    description: The other end of the line. Give its label (for example A) or a landmark name (for example
      bodice_front.SNP).
  from_point:
    type: string
    x-ref: point
    description: The point the length is measured from. Give its label (for example A) or a landmark name
      (for example bodice_front.SNP).
  length:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Distance from that point. A number or a formula in the pattern''s unit (cm in the basic
      set). A formula may use measurements, variables and other lengths, for example #hem_flare/2 + 1.'
required:
- label
- line_start
- line_end
- from_point
- length
examples:
- instruction: Shoulder end 12 cm from the neck point N along N-S
  call:
    label: T
    line_start: N
    line_end: S
    from_point: N
    length: '12'
engine:
  builder: simple
  tag: point
  type: shoulder
  set:
    name: '{label}'
    p1Line: '{line_start}'
    p2Line: '{line_end}'
    pShoulder: '{from_point}'
    length: '{length}'
