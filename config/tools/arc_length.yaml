name: arc_length
version: 1
tier: primitive
description: 'Draw an arc of a circle round a centre point, from a start angle, with a given length along
  the arc.

  Use it when the arc must be a set length, for example to match a measured seam length. Do not use it
  when the end angle is known: use arc_radius.'
parameters:
  center:
    type: string
    x-ref: point
    description: The centre of the circle. Give its label (for example A) or a landmark name (for example
      bodice_front.SNP).
  radius:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Radius of the arc. A number or a formula in the pattern''s unit (cm in the basic set).
      A formula may use measurements, variables and other lengths, for example #hem_flare/2 + 1.'
  start_angle:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Where the arc starts. Angles go counter-clockwise: 0 is to the right, 90 is up the page.
      A number or a formula in degrees. A formula may use measurements, variables and other lengths, for
      example #hem_flare/2 + 1.'
  length:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Length along the arc. A negative length runs clockwise. A number or a formula in the
      pattern''s unit (cm in the basic set). A formula may use measurements, variables and other lengths,
      for example #hem_flare/2 + 1.'
required:
- center
- radius
- start_angle
- length
examples:
- instruction: An arc of 8 cm on a 5 cm radius from the right
  call:
    center: A
    radius: '5'
    start_angle: '0'
    length: '8'
engine:
  builder: simple
  tag: arc
  type: arcWithLength
  set:
    center: '{center}'
    radius: '{radius}'
    angle1: '{start_angle}'
    length: '{length}'
