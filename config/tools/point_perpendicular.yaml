name: point_perpendicular
version: 1
tier: primitive
description: 'Create a point at a right angle to the line from one point to another, starting from the
  first point.

  Use it when you need a square corner, for example a hem line at a right angle to the centre front. Do
  not use it when the direction is not square to a line: use point_at_distance_angle.'
parameters:
  label:
    type: string
    description: Name for the new point, unique in the pattern, for example B1.
  first_point:
    type: string
    x-ref: point
    description: The point the new point is measured from, and the start of the line. Give its label (for
      example A) or a landmark name (for example bodice_front.SNP).
  second_point:
    type: string
    x-ref: point
    description: The other end of the line. Give its label (for example A) or a landmark name (for example
      bodice_front.SNP).
  length:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Distance from the first point. A number or a formula in the pattern''s unit (cm in the
      basic set). A formula may use measurements, variables and other lengths, for example #hem_flare/2
      + 1.'
  angle:
    type: number
    description: Extra turn in degrees from the exact right angle; 0 for square. A plain number, not a
      formula.
    minimum: -360
    maximum: 360
    default: 0
required:
- label
- first_point
- second_point
- length
examples:
- instruction: A point 20 cm out from A, square to line A-B
  call:
    label: C
    first_point: A
    second_point: B
    length: '20'
engine:
  builder: simple
  tag: point
  type: normal
  set:
    name: '{label}'
    firstPoint: '{first_point}'
    secondPoint: '{second_point}'
    length: '{length}'
    angle: '{angle}'
