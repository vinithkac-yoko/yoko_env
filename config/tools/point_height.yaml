name: point_height
version: 1
tier: primitive
description: 'Create the foot of the perpendicular: the point on the line between two points that is nearest
  to a base point.

  Use it when you need the square drop from a point onto a line. Do not use it when you need a point at
  a set distance along a line: use point_along_line.'
parameters:
  label:
    type: string
    description: Name for the new point, unique in the pattern, for example B1.
  base_point:
    type: string
    x-ref: point
    description: The point to drop from. Give its label (for example A) or a landmark name (for example
      bodice_front.SNP).
  line_start:
    type: string
    x-ref: point
    description: One end of the line. Give its label (for example A) or a landmark name (for example bodice_front.SNP).
  line_end:
    type: string
    x-ref: point
    description: The other end of the line. Give its label (for example A) or a landmark name (for example
      bodice_front.SNP).
required:
- label
- base_point
- line_start
- line_end
examples:
- instruction: Drop a square line from C onto A-B
  call:
    label: D
    base_point: C
    line_start: A
    line_end: B
engine:
  builder: simple
  tag: point
  type: height
  set:
    name: '{label}'
    basePoint: '{base_point}'
    p1Line: '{line_start}'
    p2Line: '{line_end}'
