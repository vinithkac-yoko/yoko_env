name: cut_curve_path
version: 1
tier: primitive
description: 'Create a point at a given length along a path of several splines, splitting it in two at
  that point.

  Use it when the curve is a spline path or Bezier path (its name starts with SplPath_). Do not use it
  when the curve is a single spline (use cut_curve).'
parameters:
  label:
    type: string
    description: Name for the new point, unique in the pattern, for example B1.
  curve:
    type: string
    x-ref: curve
    description: The spline path to cut; its name, for example SplPath_A_B. Give its label (for example
      A) or a landmark name (for example bodice_front.SNP).
  length:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Distance along the path. A number or a formula in the pattern''s unit (cm in the basic
      set). A formula may use measurements, variables and other lengths, for example #hem_flare/2 + 1.'
  direction:
    type: string
    enum:
    - forward
    - backward
    default: forward
    description: forward counts the length from the curve's first end, backward from its last end.
required:
- label
- curve
- length
examples:
- instruction: A point 8 cm along the neckline path
  call:
    label: N2
    curve: SplPath_A_C
    length: '8'
engine:
  builder: simple
  tag: point
  type: cutSplinePath
  set:
    name: '{label}'
    splinePath: '{curve}'
    length: '{length}'
    direction: '{direction}'
