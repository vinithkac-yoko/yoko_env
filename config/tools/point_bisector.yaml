name: point_bisector
version: 1
tier: primitive
description: 'Create a point on the line that halves the angle formed by three points, starting at the
  middle point.

  Use it when you need the direction that splits a corner in two equal angles. Do not use it when you
  know the direction as an angle: use point_at_distance_angle.'
parameters:
  label:
    type: string
    description: Name for the new point, unique in the pattern, for example B1.
  first_point:
    type: string
    x-ref: point
    description: A point on the first arm of the angle. Give its label (for example A) or a landmark name
      (for example bodice_front.SNP).
  second_point:
    type: string
    x-ref: point
    description: The corner of the angle; the new point is measured from here. Give its label (for example
      A) or a landmark name (for example bodice_front.SNP).
  third_point:
    type: string
    x-ref: point
    description: A point on the second arm of the angle. Give its label (for example A) or a landmark
      name (for example bodice_front.SNP).
  length:
    type: string
    x-formula: true
    maxLength: 500
    description: 'Distance from the corner. A number or a formula in the pattern''s unit (cm in the basic
      set). A formula may use measurements, variables and other lengths, for example #hem_flare/2 + 1.'
required:
- label
- first_point
- second_point
- third_point
- length
examples:
- instruction: Point 4 cm from B on the line that halves angle A-B-C
  call:
    label: D
    first_point: A
    second_point: B
    third_point: C
    length: '4'
engine:
  builder: simple
  tag: point
  type: bisector
  set:
    name: '{label}'
    firstPoint: '{first_point}'
    secondPoint: '{second_point}'
    thirdPoint: '{third_point}'
    length: '{length}'
