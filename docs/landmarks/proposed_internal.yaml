    - {kind: line, from: A1, to: A2, name: skirt_back.waist_line, group: skirt_waist, confidence: medium, reason: "the level line along the waist from centre back (A1) to centre front (A2); A9 (the back's waist width) and A15 (the front's) are measured along it"}
    - {kind: line, from: A5, to: A6, name: skirt_back.hip_line, group: skirt_hip, confidence: medium, reason: "the level line at the hip: A5 is height_waist_side_to_hip below the waist on the centre-back line, A7 (hip_circ/4 plus ease) lies on it"}
