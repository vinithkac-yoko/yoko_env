# Proposed names for things that are NOT on a piece's outline: dart apexes, the bust point, guide
# lines (waist, hip, bust, knee), the centre-front and centre-back lines. NOTHING HERE IS VERIFIED.
# They have no row on the outline tabs, so the sheet lists them in a second table under each
# piece's outline table, with their own numbers (i1, i2, ...) drawn in blue on the picture.
#
# kind: point | line.  A point is a Seamly2D label; a line is the straight line between two labels
# (Seamly2D draws it as the main line of a point tool, so it has no label of its own).
# group: entries with the same group are one Seamly2D line (or point) that two pieces name
#   differently; the sheet shows both names on both rows.
# confidence as in proposed_names.yaml.
version: 1
status: proposed
pieces:
