# Proposed landmark names for the basic pattern set. NOTHING HERE IS VERIFIED.
# Each entry is a best guess from how the point was drawn and where it sits on the piece; the
# pattern makers confirm, correct or reject every row (docs/landmarks/README.md).
# Key: the Seamly2D label (or curve name) as shown in the sheet, plus its row number on the piece.
# confidence: high = the formula names the thing (e.g. uses hip_circ for a hip point); medium = shape
# and position make it likely; low = a guess from shape alone.
