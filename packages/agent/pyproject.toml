[project]
name = "yoko-agent"
version = "0.0.0"
description = "Policies, drafter run loop, planner agent, flat sketch generator. The only package that may import a model SDK."
requires-python = ">=3.12"
dependencies = [
  "yoko-env"
]

[tool.uv.sources]
yoko-env = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoko_agent"]
