[project]
name = "yoko-tools"
version = "0.0.0"
description = "Action schemas, dispatcher, error codes, format adapters, recipes."
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.26.0",
  "pydantic>=2.14.0",
  "pyyaml>=6.0.3",
  "yoko-engine",
  "yoko-io",
]

[tool.uv.sources]
yoko-engine = { workspace = true }
yoko-io = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoko_tools"]
