[project]
name = "yoko-tools"
version = "0.0.0"
description = "Action schemas, dispatcher, error codes, format adapters, recipes."
requires-python = ">=3.12"
dependencies = [
  "yoko-engine",
  "yoko-io"
]

[tool.uv.sources]
yoko-engine = { workspace = true }
yoko-io = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoko_tools"]
