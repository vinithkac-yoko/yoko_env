[project]
name = "yoko-env"
version = "0.0.0"
description = "reset/step/state, observations, episodes, forking, reward hook."
requires-python = ">=3.12"
dependencies = [
  "yoko-engine",
  "yoko-io",
  "yoko-tools"
]

[tool.uv.sources]
yoko-engine = { workspace = true }
yoko-io = { workspace = true }
yoko-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoko_env"]
