[project]
name = "yoko-server"
version = "0.0.0"
description = "FastAPI app (studio API, env HTTP API), the `yoko` CLI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "yoko-agent",
  "yoko-data",
  "yoko-bench",
  "yoko-env"
]

[project.scripts]
yoko = "yoko_server.cli:main"

[tool.uv.sources]
yoko-agent = { workspace = true }
yoko-data = { workspace = true }
yoko-bench = { workspace = true }
yoko-env = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoko_server"]
