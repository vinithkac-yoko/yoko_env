[project]
name = "yoko-bench"
version = "0.0.0"
description = "Tasks, scorers, reward specs, benchmark runner, reports."
requires-python = ">=3.12"
dependencies = [
  "yoko-env"
]

[tool.uv.sources]
yoko-env = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoko_bench"]
