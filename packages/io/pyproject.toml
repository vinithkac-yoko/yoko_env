[project]
name = "yoko-io"
version = "0.0.0"
description = "Seamly2D import/export (lossless), SVG/PNG render."
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7",
  "pillow>=10.1",
  "pyyaml>=6",
  "yoko-engine"
]

[tool.uv.sources]
yoko-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoko_io"]
