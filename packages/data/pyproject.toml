[project]
name = "yoko-data"
version = "0.0.0"
description = "Trajectory store, importers, derivation diffs, teacher data, exports."
requires-python = ">=3.12"
dependencies = [
  "yoko-env"
]

[tool.uv.sources]
yoko-env = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoko_data"]
