[project]
name = "yoko-env-workspace"
version = "0.0.0"
description = "yoko-env: environment for AI agents that turn a design idea into a garment pattern."
requires-python = ">=3.12"
dependencies = [
  "yoko-engine", "yoko-io", "yoko-tools", "yoko-env",
  "yoko-agent", "yoko-data", "yoko-bench", "yoko-server",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "import-linter>=2.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
yoko-engine = { workspace = true }
yoko-io = { workspace = true }
yoko-tools = { workspace = true }
yoko-env = { workspace = true }
yoko-agent = { workspace = true }
yoko-data = { workspace = true }
yoko-bench = { workspace = true }
yoko-server = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures", "studio"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-ra --import-mode=importlib"

[tool.pyright]
include = ["packages", "tests"]
exclude = ["**/node_modules", "studio", "fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Strict where the spec demands it (engine, tools, env).
strict = ["packages/engine", "packages/tools", "packages/env"]

[tool.coverage.run]
source = ["packages"]
branch = true

[tool.importlinter]
root_packages = [
  "yoko_engine", "yoko_io", "yoko_tools", "yoko_env",
  "yoko_agent", "yoko_data", "yoko_bench", "yoko_server",
]
include_external_packages = true

# Dependencies point one way only: engine <- io <- tools <- env <- agent/data/bench <- server.
[[tool.importlinter.contracts]]
name = "Package layers"
type = "layers"
layers = [
  "yoko_server",
  "yoko_agent | yoko_data | yoko_bench",
  "yoko_env",
  "yoko_tools",
  "yoko_io",
  "yoko_engine",
]

# Model-agnostic: no model SDK outside packages/agent.
[[tool.importlinter.contracts]]
name = "Model SDKs only in yoko_agent"
type = "forbidden"
source_modules = [
  "yoko_engine", "yoko_io", "yoko_tools", "yoko_env",
  "yoko_data", "yoko_bench", "yoko_server",
]
forbidden_modules = ["anthropic", "openai"]
