name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.8.17" }
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest --cov --cov-report=term-missing
      - name: engine coverage gate (90%)
        run: uv run pytest packages/engine tests --cov=packages/engine/src --cov-fail-under=90 -q

  studio:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: studio } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: studio/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, studio]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t yoko-env:ci .
      - name: smoke
        run: |
          docker run -d --rm -p 8000:8000 -e STUDIO_TOKEN=ci --name app yoko-env:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break || sleep 1; done
          curl -fs localhost:8000/api/build | grep seamly2d_pin
          curl -fs -H "Authorization: Bearer ci" localhost:8000/api/fixtures | grep Aldrich
