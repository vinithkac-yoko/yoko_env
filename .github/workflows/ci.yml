name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    # the studio's database tests run on SQLite and, with this, on Postgres as on Railway
    services:
      postgres:
        image: postgres:16-bookworm
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: yoko }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      YOKO_TEST_DATABASE_URL: postgresql+psycopg://postgres:pw@localhost:5432/yoko
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.8.17" }
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest --cov --cov-report=term-missing
      - name: engine coverage gate (90%)
        run: uv run pytest packages/engine tests --cov=packages/engine/src --cov-fail-under=90 -q

  studio:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: studio } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: studio/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # the studio in a real browser against the real app (SQLite)
    runs-on: ubuntu-24.04
    needs: [python, studio]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.8.17" }
      - run: uv sync --all-packages --frozen
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: studio/package-lock.json }
      - working-directory: studio
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e

  docker:
    runs-on: ubuntu-24.04
    needs: [python, studio]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t yoko-env:ci .
      - name: smoke
        run: |
          docker run -d --rm -p 8000:8000 -e STUDIO_TOKEN=ci --name app yoko-env:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break || sleep 1; done
          curl -fs localhost:8000/api/build | grep seamly2d_pin
          curl -fs -H "Authorization: Bearer ci" localhost:8000/api/fixtures | grep Aldrich
      - name: every test, the Seamly2D comparisons included, inside the app image
        # the deployed image's own Python and maths library (Debian bookworm); a fresh environment
        # from the same lock file, because the image has no test tools
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_PYTHON_DOWNLOADS=never \
            -e UV_PYTHON=/usr/local/bin/python3.12 -e UV_CACHE_DIR=/tmp/uvcache \
            yoko-env:ci sh -c "cp -r /repo /work && cd /work && rm -rf .venv \
              && uv sync -q --frozen --all-packages && ldd --version | head -1 && uv run python -V \
              && uv run pytest -q -p no:cacheprovider"
