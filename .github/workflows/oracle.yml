# The oracle: build the real, pinned Seamly2D with Qt 6.11.1 (what Seamly2D itself builds with),
# make it compute the basic pattern set, and check that the engine still agrees bit for bit.
# Also regenerates the real-Qt vectors and fails if they differ from the committed ones.
# See docker/oracle/README.md and docs/adr/0002.
name: oracle
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "packages/engine/**"
      - "packages/io/**"
      - "fixtures/**"
      - "docker/oracle/**"
      - "tools/oracle/**"
      - "scripts/oracle_*.sh"
      - "tests/**"
      - ".github/workflows/oracle.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly: Qt and runner images move under us

env:
  QT_VERSION: "6.11.1" # same as Seamly2D's own CI
  SEAMLY2D_PIN: v2026.10.5.154

jobs:
  oracle:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxerces-c-dev xvfb

      - name: cache the Seamly2D build
        id: cache
        uses: actions/cache@v4
        with:
          path: seamly2d-build
          key: seamly2d-${{ env.SEAMLY2D_PIN }}-qt${{ env.QT_VERSION }}-${{ hashFiles('docker/oracle/yoko-oracle-dump.patch') }}

      - name: build Seamly2D with the dump hook
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SEAMLY2D_PIN" https://github.com/FashionFreedom/seamly2d seamly2d-src
          git -C seamly2d-src apply "$GITHUB_WORKSPACE/docker/oracle/yoko-oracle-dump.patch"
          mkdir seamly2d-build && cd seamly2d-build
          qmake ../seamly2d-src/Seamly2D.pro CONFIG+=release CONFIG+=noTests
          make -j"$(nproc)"

      - uses: astral-sh/setup-uv@v5
        with: { version: "0.8.17" }
      - run: uv sync --all-packages --frozen

      - name: Seamly2D opens and saves the basic set and Seamly2D's own test patterns
        run: |
          scripts/oracle_base.sh seamly2d-build/src/app/seamly2d/bin/seamly2d
          scripts/oracle_upgrade.sh seamly2d-build/src/app/seamly2d/bin/seamly2d

      - name: the committed oracle files are what Seamly2D just produced
        run: |
          git status --short fixtures
          git diff --stat -- fixtures
          git diff --exit-code -- fixtures > /dev/null

      - name: the engine and the writers agree with Seamly2D, exactly
        run: uv run pytest tests/test_oracle_basic_set.py tests/test_roundtrip.py tests/test_external_seamly2d.py -q

      # Qt 6.11.1 on the runner's libm gives a result one ulp away from Qt 6.4.2 on glibc 2.39 in about
      # 1 of 4000 random cases (setAngle, flip). The pattern results above are exact; here we allow 2 ulp.
      - name: real-Qt vectors agree under Qt ${{ env.QT_VERSION }} (within 2 ulp)
        run: |
          export PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          mkdir -p "$RUNNER_TEMP/qt"
          build() { g++ -std=c++17 -O2 -fPIC "tools/oracle/$1.cpp" -o "$RUNNER_TEMP/qt/$1" $(pkg-config --cflags --libs Qt6Core Qt6Gui); }
          build qt_vectors; build qt_flip; build qt_polyline_length
          "$RUNNER_TEMP/qt/qt_vectors" 4000 > "$RUNNER_TEMP/qt/lines.jsonl"
          "$RUNNER_TEMP/qt/qt_flip" > "$RUNNER_TEMP/qt/flip.jsonl"
          "$RUNNER_TEMP/qt/qt_polyline_length" > "$RUNNER_TEMP/qt/poly.jsonl"
          # report every difference before failing: a changed last bit is a finding, not noise
          status=0
          zcat fixtures/oracle/qt_lines.jsonl.gz > "$RUNNER_TEMP/qt/lines.committed"
          # the committed flip and polyline files are the first 2000 and 400 lines of the generators
          zcat fixtures/oracle/qt_flip.jsonl.gz > "$RUNNER_TEMP/qt/flip.committed"
          zcat fixtures/oracle/qt_polyline_length.jsonl.gz > "$RUNNER_TEMP/qt/poly.committed"
          head -2000 "$RUNNER_TEMP/qt/flip.jsonl" > "$RUNNER_TEMP/qt/flip.fresh"
          head -400 "$RUNNER_TEMP/qt/poly.jsonl" > "$RUNNER_TEMP/qt/poly.fresh"
          for n in lines flip poly; do
            fresh="$RUNNER_TEMP/qt/$n.jsonl"; [ -f "$RUNNER_TEMP/qt/$n.fresh" ] && fresh="$RUNNER_TEMP/qt/$n.fresh"
            echo "== $n"
            python3 scripts/jsonl_diff.py "$RUNNER_TEMP/qt/$n.committed" "$fresh" --max-ulps 2 || status=1
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-output
          path: fixtures/
          if-no-files-found: ignore
